<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the tutor</title>
<link rel="stylesheet" href="/style.css">
<style>
  .app .ai-note { position: sticky; top: var(--bar, 4.25rem); z-index: 5; }
</style>
</head>
<body class="app">
<header class="topbar"><div class="inner">
  <a class="brand" href="/">Study tutor</a>
  <nav class="topnav" aria-label="Main">
    <a href="/">Lessons</a><a href="/map.html">Map</a><a href="/practice.html">Practice</a><a href="/case.html">Today's case</a><a href="/squad.html">Squad</a><a href="/coach.html">Coach Dan</a>
  </nav>
</div></header>
<main class="lesson chat-page">
  <header>
    <p class="crumb"><a href="/">Lessons</a> · ask the tutor</p>
    <h1 id="title">Ask the tutor</h1>
  </header>

  <section class="panel chat-panel">
    <p class="ai-note ai-line" role="note">This is an AI. It can be wrong. It will not give you the answer before you have tried.</p>

    <section id="item" class="question-card">
      <p class="stem" id="stem">Loading the question.</p>
      <div class="figure" id="figure" hidden></div>
      <div class="working faded" id="scaffold" hidden><p></p></div>
    </section>

    <div id="chat">
      <p class="note" id="no-model" hidden>No model is set up, so you get the tutor's built-in help.</p>

      <ol id="log" class="bubbles" aria-live="polite"></ol>

      <section id="before" class="composer" hidden>
        <form id="guess-form">
          <label for="guess">How would you do this one? A rough guess is fine.</label>
          <textarea id="guess" rows="2"></textarea>
          <button type="submit">Check my guess</button>
        </form>
        <form id="hint-form">
          <label for="working">Your working so far (you can leave this empty)</label>
          <textarea id="working" rows="2"></textarea>
          <button type="submit" class="secondary">Hint</button>
        </form>
      </section>

      <section id="after" class="composer" hidden>
        <form id="teach-form">
          <label for="teach">Explain how you did it, one step per line.</label>
          <textarea id="teach" rows="4"></textarea>
          <button type="submit">Mark my steps</button>
        </form>
      </section>
    </div>
  </section>
</main>
<script src="/chat.js"></script>
</body>
</html>
